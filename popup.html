<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Bookmarks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>🔖 AI Bookmarks</h1>
      <div class="header-actions">
        <button id="darkModeBtn" class="icon-btn" title="深色模式">🌙</button>
        <button id="settingsBtn" class="icon-btn" title="设置">⚙️</button>
      </div>
    </header>

    <!-- Quick Save Section -->
    <section id="quickSave" class="section">
      <div class="current-page">
        <img id="favicon" src="" alt="" class="favicon">
        <div class="page-info">
          <h3 id="pageTitle">当前页面</h3>
          <p id="pageUrl" class="url"></p>
        </div>
      </div>
      <div class="save-actions">
        <button id="saveBtn" class="primary-btn">
          <span class="btn-icon">➕</span>
          <span>一键收藏</span>
        </button>
        <button id="saveWithNoteBtn" class="secondary-btn" title="添加笔记收藏">📝</button>
      </div>
      <div id="saveStatus" class="status"></div>
      <div class="shortcut-hint">快捷键: Alt+Shift+S 快速收藏</div>
    </section>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="search">🔍 搜索</button>
      <button class="tab" data-tab="bookmarks">📚 书签</button>
      <button class="tab" data-tab="review">🔔 回顾</button>
      <button class="tab" data-tab="stats">📊 统计</button>
    </nav>

    <!-- Search Tab -->
    <section id="searchTab" class="tab-content active">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="用自然语言搜索，如：那篇讲 SEO 的文章...">
        <button id="searchBtn" class="search-btn">搜索</button>
      </div>
      <div id="searchResults" class="results-list"></div>
    </section>

    <!-- Bookmarks Tab -->
    <section id="bookmarksTab" class="tab-content">
      <div class="filter-bar">
        <select id="categoryFilter">
          <option value="">全部分类</option>
        </select>
        <select id="statusFilter">
          <option value="">全部状态</option>
          <option value="ok">正常</option>
          <option value="broken">失效</option>
        </select>
        <span id="bookmarkCount" class="count">0 个书签</span>
      </div>
      <div id="bookmarksList" class="results-list"></div>
    </section>

    <!-- Review Tab -->
    <section id="reviewTab" class="tab-content">
      <div class="review-header">
        <h3>📖 今日回顾</h3>
        <p class="subtitle">这些收藏值得重温</p>
      </div>
      <div id="reviewList" class="results-list"></div>
    </section>

    <!-- Stats Tab -->
    <section id="statsTab" class="tab-content">
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-number" id="totalBookmarks">0</div>
          <div class="stat-label">总书签数</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="reviewedCount">0</div>
          <div class="stat-label">已回顾</div>
        </div>
        <div class="stat-card warning">
          <div class="stat-number" id="brokenCount">0</div>
          <div class="stat-label">失效链接</div>
        </div>
      </div>

      <div class="stats-section">
        <h4>📁 分类分布</h4>
        <div id="categoryStats" class="category-bars"></div>
      </div>

      <div class="stats-section">
        <h4>🏷️ 热门关键词</h4>
        <div id="keywordCloud" class="keyword-cloud"></div>
      </div>

      <div class="stats-section">
        <h4>📈 收藏趋势</h4>
        <div id="trendChart" class="trend-chart"></div>
      </div>

      <div class="stats-actions">
        <button id="checkLinksBtn" class="secondary-btn">🔗 检查所有链接</button>
      </div>
    </section>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>⚙️ 设置</h2>
          <button id="closeSettings" class="close-btn">×</button>
        </div>
        <div class="modal-body">
          <div class="setting-item">
            <label for="apiKey">OpenAI API Key</label>
            <input type="password" id="apiKey" placeholder="sk-...">
            <p class="hint">用于 AI 摘要和语义搜索</p>
          </div>
          <div class="setting-item">
            <label for="reviewTime">每日回顾时间</label>
            <input type="time" id="reviewTime" value="09:00">
          </div>
          <div class="setting-item">
            <label for="reviewCount">每日回顾数量</label>
            <input type="number" id="reviewCount" value="3" min="1" max="10">
          </div>
          <button id="saveSettings" class="primary-btn">保存设置</button>

          <hr>

          <h3>数据管理</h3>
          <div class="setting-item button-group">
            <button id="exportBtn" class="secondary-btn">📤 导出书签</button>
            <button id="importBtn" class="secondary-btn">📥 导入书签</button>
            <input type="file" id="importFile" accept=".json" style="display:none">
          </div>
          <div class="setting-item">
            <button id="importBrowserBtn" class="secondary-btn full-width">🌐 导入浏览器书签</button>
            <p class="hint">从 Chrome 书签栏导入所有书签</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bookmark Detail Modal -->
    <div id="detailModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="detailTitle">书签详情</h2>
          <button id="closeDetail" class="close-btn">×</button>
        </div>
        <div class="modal-body">
          <div class="detail-section">
            <label>摘要</label>
            <p id="detailSummary" class="summary-text"></p>
          </div>
          <div class="detail-section">
            <label>为什么值得读</label>
            <p id="detailWhyRead" class="why-read-text"></p>
          </div>
          <div class="detail-section">
            <label>分类</label>
            <div id="detailCategory" class="category-tag"></div>
          </div>
          <div class="detail-section">
            <label>关键词</label>
            <div id="detailKeywords" class="keywords"></div>
          </div>
          <div class="detail-section">
            <label>笔记</label>
            <textarea id="detailNote" class="note-input" placeholder="添加你的笔记..."></textarea>
            <button id="saveNoteBtn" class="small-btn">保存笔记</button>
          </div>
          <div class="detail-section">
            <label>链接状态</label>
            <span id="detailLinkStatus" class="link-status"></span>
            <button id="checkLinkBtn" class="small-btn">检查</button>
          </div>
          <div class="detail-section">
            <label>收藏时间</label>
            <p id="detailDate"></p>
          </div>

          <div class="detail-section">
            <label>相似书签</label>
            <div id="similarBookmarks" class="similar-list"></div>
          </div>

          <div class="detail-actions">
            <button id="openBookmark" class="primary-btn">打开链接</button>
            <button id="deleteBookmark" class="danger-btn">删除</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Note Modal -->
    <div id="noteModal" class="modal hidden">
      <div class="modal-content small">
        <div class="modal-header">
          <h2>📝 添加笔记</h2>
          <button id="closeNoteModal" class="close-btn">×</button>
        </div>
        <div class="modal-body">
          <p id="notePageTitle" class="note-page-title"></p>
          <textarea id="saveNote" class="note-input large" placeholder="为什么收藏这个页面？有什么想法？"></textarea>
          <button id="confirmSaveWithNote" class="primary-btn">收藏并保存笔记</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
